<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAMERA 05</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;800&display=swap">
<link rel="stylesheet" href="noc/kamera.css?v=20261006">
</head>
<body class="cam-body">
<main class="cam" id="cam">
  <div class="cam-pan"><img class="cam-img" id="camImg" alt="" hidden></div>
  <canvas class="cam-noise" id="camNoise" aria-hidden="true"></canvas>
  <div class="cam-scan" aria-hidden="true"></div>
  <div class="cam-corners" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <div class="cam-hud cam-hud-tl">
    <p class="cam-name" id="camName">CAM 05</p>
    <p class="cam-room" id="camRoom">SALA</p>
  </div>
  <div class="cam-hud cam-hud-tr">
    <p class="cam-date">28-10-2023</p>
    <p class="cam-time" id="camClock">02:37:21</p>
    <p class="cam-rec" id="camRec" hidden>● REC</p>
  </div>
  <div class="cam-hud cam-hud-bl">
    <p class="cam-sys">SYSTEM MONITORINGU <span>v2.37</span></p>
  </div>

  <div class="cam-gate" id="camGate">
    <p class="cam-gate-title" id="camGateTitle">BRAK SYGNAŁU</p>
    <p class="cam-gate-text" id="camGateText">Łączenie…</p>
    <button type="button" class="cam-connect" id="camConnect" hidden>POŁĄCZ Z KAMERĄ 05</button>
  </div>
</main>
<script type="module" src="noc/kamera.js?v=20261006"></script>
</body>
</html>
